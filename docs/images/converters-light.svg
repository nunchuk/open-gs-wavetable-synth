<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two ways from the synth's 22 050 Hz to 48 kHz</title><desc>A tone goes in at each frequency up to 11 kHz. Transparent: the tone comes out within 0.0003 dB up to 10.5 kHz and no image comes within 103 dB. Windows 10's converter: -6.7 dB at 10 kHz, -15.6 dB at 11 kHz, images up to -16 dB.</desc>
<rect width="760" height="560" rx="8" fill="#fcfcfb"/>
<text x="32.0" y="36.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Two ways from the synth’s 22 050 Hz to 48 kHz</text>
<text x="32.0" y="58.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">A tone at each frequency goes in. Top: how loud it comes out. Bottom: the loudest image it adds (dB re the tone in).</text>
